name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax check (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile every source file
        shell: pwsh
        run: |
          $failed = $false
          $files = Get-ChildItem -Path . -Filter *.py -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\\.venv\\|\\venv\\|\\build\\|\\dist\\|\\__pycache__\\' }

          if (-not $files) {
            Write-Host "::error::No Python files found at repo root"
            exit 1
          }

          foreach ($f in $files) {
            Write-Host "::group::Compiling $($f.Name)"
            python -m py_compile $f.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error file=$($f.FullName)::py_compile failed"
              $failed = $true
            }
            Write-Host "::endgroup::"
          }

          if ($failed) { exit 1 }
          Write-Host "All source files compile cleanly."

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure no private files are tracked
        run: |
          set -euo pipefail
          PRIVATE_PATTERN='(^|/)(karen_config\.json|memory\.json|apps\.json|tasks\.json|pronunciations\.json|groq_key\.txt|karen\.log|stdio\.log)$'
          if git ls-files | grep -E "$PRIVATE_PATTERN"; then
            echo "::error::Private user files must not be committed. Add them to .gitignore."
            exit 1
          fi
          echo "✓ No private files tracked"

      - name: Ensure no build artifacts or models are tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(build/|dist/|models/|__pycache__/)|\.(gguf|onnx|bin|part|safetensors|pt|pth)$'; then
            echo "::error::Build artifacts or model files must not be committed."
            exit 1
          fi
          echo "✓ No build artifacts or models tracked"

      - name: Ensure no API keys are committed
        run: |
          set -euo pipefail
          # Groq keys start with gsk_ and are ~50 chars
          if grep -rEn 'gsk_[A-Za-z0-9]{20,}' --include='*.py' --include='*.json' --include='*.yml' .; then
            echo "::error::Possible Groq API key committed. Rotate the key, then remove it from history."
            exit 1
          fi
          # OpenAI-style keys
          if grep -rEn 'sk-[A-Za-z0-9]{20,}' --include='*.py' --include='*.json' --include='*.yml' . | grep -v 'PASTE_NEW_KEY'; then
            echo "::error::Possible OpenAI-style API key committed."
            exit 1
          fi
          echo "✓ No committed API keys detected"

      - name: Ensure .gitignore covers the essentials
        run: |
          set -euo pipefail
          for pat in karen_config.json memory.json models/ dist/ build/ __pycache__/ groq_key.txt stdio.log; do
            if ! grep -qF "$pat" .gitignore; then
              echo "::error::.gitignore is missing an entry for $pat"
              exit 1
            fi
          done
          echo "✓ .gitignore covers all essentials"
