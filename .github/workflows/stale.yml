name: Stale

on:
  schedule:
    - cron: "0 6 * * *"   # Every day at 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # ---- Issues ----
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: |
            This issue has been inactive for 60 days. If it's still relevant,
            please leave a comment with any new details — a log excerpt, the
            commands you tried, and your current `main` commit.

            Without activity it will be closed in 14 days. Reopening later
            with a fresh description is always welcome.
          close-issue-message: |
            Closing due to inactivity. If you're still seeing this on the
            latest `main`, feel free to reopen with the current `karen.log`
            and steps to reproduce.
          exempt-issue-labels: "pinned,security,help wanted,good first issue,confirmed,in-progress"

          # ---- Pull requests ----
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-pr-label: "stale"
          stale-pr-message: |
            This PR has been inactive for 45 days. If you're still working on
            it, please push any progress or leave a comment so we know it's
            alive. Otherwise it will be closed in 14 days.
          close-pr-message: |
            Closing due to inactivity. Reopen whenever you're ready to
            continue — no hard feelings.
          exempt-pr-labels: "pinned,security,help wanted,good first issue,confirmed,in-progress,work-in-progress"

          # ---- Operational ----
          operations-per-run: 30
          remove-stale-when-updated: true
          ascending: true
          enable-statistics: true
